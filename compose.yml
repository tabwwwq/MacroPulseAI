# MacroPulse AI — local production-like stack: PostgreSQL + FastAPI + Next.js.
#   docker compose up --build        then open http://localhost:3000
# Values come from `.env` (see .env.example); ports bind to localhost only.
name: macropulse

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-macropulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-macropulse}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-macropulse}:${POSTGRES_PASSWORD:-change-me-local-only}@db:5432/${POSTGRES_DB:-macropulse}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      COMPUTE_REQUESTS_PER_MINUTE: ${COMPUTE_REQUESTS_PER_MINUTE:-240}
      FRED_API_KEY: ${FRED_API_KEY:-}
      MODELS_DIR: /app/models/artifacts
    volumes:
      - models:/app/models/artifacts
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pgdata: {}
  models: {}
