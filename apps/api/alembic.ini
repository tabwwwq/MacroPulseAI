# Alembic config for manual use, e.g. `uv run alembic -c apps/api/alembic.ini revision -m "..."`.
# The database URL is taken from MacroPulse settings (DATABASE_URL / .env), not from this file.
# Day-to-day: `uv run macropulse db upgrade` (migrates + syncs the country/source registry).

[alembic]
script_location = %(here)s/src/macropulse_api/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
