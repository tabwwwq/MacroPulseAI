[project]
name = "macropulse-api"
version = "0.1.0"
description = "MacroPulse AI — FastAPI service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "httpx>=0.28",
    "macropulse-economics",
    "macropulse-ml",
    "scipy>=1.14",  # chi-square threshold for the scenario plausibility check
    "reportlab>=4.2",
    "matplotlib>=3.9",
]

[project.scripts]
macropulse = "macropulse_api.cli:main"

[tool.uv.sources]
macropulse-economics = { workspace = true }
macropulse-ml = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/macropulse_api"]
