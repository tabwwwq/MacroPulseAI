name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Python)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: macropulse
          POSTGRES_PASSWORD: macropulse
          POSTGRES_DB: macropulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U macropulse" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      MACROPULSE_TEST_POSTGRES_URL: postgresql+psycopg://macropulse:macropulse@localhost:5432/macropulse
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type-check
        run: uv run mypy
      - name: Tests (SQLite + PostgreSQL)
        run: uv run pytest --cov=macropulse_api --cov=macropulse_economics --cov=macropulse_ml --cov-report=term-missing
      - name: OpenAPI schema is committed and current
        run: |
          uv run macropulse openapi --out packages/shared-types/openapi.json
          git diff --exit-code packages/shared-types/openapi.json

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated API types are current
        run: |
          pnpm --filter @macropulse/shared-types gen
          git diff --exit-code packages/shared-types/src/openapi.ts
      - run: pnpm --filter @macropulse/web lint
      - run: pnpm --filter @macropulse/web typecheck
      - run: pnpm --filter @macropulse/web test
      - run: pnpm --filter @macropulse/web build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Client bundle holds no secrets or server-only names
        run: python3 scripts/security_scan.py --bundle apps/web/.next/static

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the whole history is scanned for secrets
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          enable-cache: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Secrets in git history and tracked files
        run: |
          python3 scripts/security_scan.py --history
          git ls-files -z | grep -zvE '\.(png|jpg|gz)$|pnpm-lock\.yaml$|uv\.lock$' \
            | xargs -0 python3 scripts/security_scan.py --tree
      - name: Python dependencies (pip-audit)
        run: |
          uv export --frozen --no-dev --all-packages --no-emit-workspace --format requirements-txt --no-hashes > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 -r "$RUNNER_TEMP/requirements.txt" --progress-spinner off
      - run: pnpm install --frozen-lockfile
      - name: Web dependencies (pnpm audit)
        run: pnpm audit --prod

  e2e:
    name: E2E (Playwright, demo snapshot)
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          enable-cache: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: uv sync --all-packages --frozen
      - run: pnpm install --frozen-lockfile
      - name: Genuine demo snapshot and a trained model (no network, no keys)
        run: |
          uv run macropulse db upgrade
          uv run macropulse demo-load
          uv run macropulse train
      - run: pnpm --filter @macropulse/web build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: pnpm --filter @macropulse/web exec playwright install --with-deps chromium
      - name: Playwright (desktop + mobile, accessibility, failure paths, full flows)
        run: pnpm --filter @macropulse/web exec playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  docker:
    name: Docker compose stack
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v5
      - name: Build and start PostgreSQL, API and web
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Migrations, readiness and the web proxy
        run: |
          docker compose exec -T api macropulse db current
          curl -fsS http://127.0.0.1:8000/api/ready | tee "$RUNNER_TEMP/ready.json"
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert d['status'] == 'ready', d" "$RUNNER_TEMP/ready.json"
          curl -fsS -o /dev/null -w "web %{http_code}\n" http://127.0.0.1:3000/
          curl -fsS http://127.0.0.1:3000/api/health
      - name: Demo snapshot into PostgreSQL, served through the API
        run: |
          docker compose exec -T api macropulse demo-load
          curl -fsS http://127.0.0.1:8000/api/sources/status \
            | python3 -c "import json,sys; d=json.load(sys.stdin); assert any(i['data_mode'] == 'snapshot' for i in d['items']), d"
          curl -fsS http://127.0.0.1:8000/api/countries/DE/summary \
            | python3 -c "import json,sys; d=json.load(sys.stdin); assert any(k['value'] is not None for k in d['kpis']), d"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v
