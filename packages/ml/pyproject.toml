[project]
name = "macropulse-ml"
version = "0.1.0"
description = "MacroPulse AI — technical-recession target, as-of features, temporal backtests and models"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "macropulse-economics",
]

[project.optional-dependencies]
# Optional boosted-tree challenger; training records "not installed" when absent.
xgboost = ["xgboost>=2.1"]

[tool.uv.sources]
macropulse-economics = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/macropulse_ml"]
